version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    groups:
      # MUST be listed FIRST — Dependabot uses first-matching-group, so this wins
      # over the catch-alls below. The codeql-action sub-actions (init, analyze,
      # upload-sarif) are ONE release train and must bump together; grouping across
      # ALL update types (no update-types filter) keeps them from splitting and
      # desyncing CodeQL ("Loaded a configuration file for version X, running Y").
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Security-related actions - prioritize these
      security-actions:
        patterns:
          - "ossf/*"
          - "github/codeql-action"
          - "step-security/*"
        update-types:
          - "minor"
          - "patch"
      # CI/CD actions
      ci-actions:
        patterns:
          - "actions/*"
          - "dependabot/*"
          - "github/*"
        exclude-patterns:
          - "github/codeql-action"
        update-types:
          - "minor"
          - "patch"
      # Third-party actions (catch-all)
      other-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "ossf/*"
          - "github/*"
          - "step-security/*"
          - "actions/*"
          - "dependabot/*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "deps:all"
      - "deps:github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
